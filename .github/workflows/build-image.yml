name: Build image

on:
  workflow_call:
    inputs:
      username:
        required: true
        type: string
      project-name:
        required: true
        type: string
      org-name:
        required: true
        type: string
      image-name:
        required: true
        type: string
      branch-name:
        required: true
        type: string

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # Branch names may contain characters a Docker tag cannot (most commonly '/'),
      # so map them onto the tag grammar: [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}
      - name: Derive image tag from branch name
        id: tag
        env:
          RAW_BRANCH: ${{ inputs.branch-name }}
        run: |
          tag=$(printf '%s' "$RAW_BRANCH" | sed -E 's/[^a-zA-Z0-9._-]+/-/g; s/^[^a-zA-Z0-9_]+//')
          tag=${tag:0:128}
          if [ -z "$tag" ]; then tag=branch; fi
          echo "Branch '$RAW_BRANCH' -> image tag '$tag'"
          # Both writes are needed: GITHUB_OUTPUT crosses to the test-image job,
          # GITHUB_ENV serves the remaining steps in this job.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '>=22.14.0'
          check-latest: true

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm -o camunda-lint-sbom.json

      - name: List generated SBOM file
        run: ls -l camunda-lint-sbom.json

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find previous image tagged with branch name - and delete it
        run: |
          json_response_file=$(mktemp)

          http_status=$(curl -s -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o "${json_response_file}" \
            "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions")

          if [ "${http_status}" -eq 404 ]; then
            exit 0
          fi

          id=$(jq -r --arg tag "$IMAGE_TAG" '.[] | select(.metadata.container.tags | index($tag)) | .id' "${json_response_file}")

          if [ "$id" != "" ]; then
            # First call is just to see the result
            curl -s -L \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions/$id"
            # Second call does the actual delete
            curl -s -L -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions/$id"
          fi

      - name: Build Docker image of application, tag with branch name
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ inputs.image-name }}
        run: |
          echo "image-name = $IMAGE"
          echo "image-tag = $IMAGE_TAG"
          docker build \
                --secret id=GH_TOKEN,env=NPM_TOKEN \
                --build-arg BPMNLINT_VER="${{ vars.BPMNLINT_VER }}" \
                --build-arg BPMNLINT_UTILS_VER="${{ vars.BPMNLINT_UTILS_VER }}" \
                --build-arg BPMN_MODDLE_VER="${{ vars.BPMN_MODDLE_VER }}" \
                --build-arg ZEEBE_BPMN_MODDLE_VER="${{ vars.ZEEBE_BPMN_MODDLE_VER }}" \
                --build-arg DMNLINT_VER="${{ vars.DMNLINT_VER }}" \
                --build-arg DMNLINT_UTILS_VER="${{ vars.DMNLINT_UTILS_VER }}" \
                --build-arg DMN_MODDLE_VER="${{ vars.DMN_MODDLE_VER }}" \
                -t "$IMAGE:$IMAGE_TAG" .

      - name: View the installed packages and versions
        run: |
          docker run -i --rm $IMAGE:$IMAGE_TAG ver

      - name: Push to local registry
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          docker push "$IMAGE:$IMAGE_TAG"
  test-image:
    runs-on: ubuntu-latest
    needs: build-image
    env:
      # Derived once in build-image; job-level env makes it visible to every step below.
      IMAGE_TAG: ${{ needs.build-image.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '>=22.14.0'
          check-latest: true

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull the image
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          docker pull "$IMAGE:$IMAGE_TAG"

      - name: Run Smoke Test
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          docker run -i --rm \
            --mount type=bind,src=${PWD}/test/smoke-test,dst=/project \
            "$IMAGE:$IMAGE_TAG" lint

      - name: Run Integration Tests
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          BRANCH_NAME: ${{ env.IMAGE_TAG }}
        run: |
          npm run test:integration

#      - name: Run SBOM Test
#        env:
#          IMAGE: ${{ inputs.image-name }}
#        run: |
#          docker run -i --rm "$IMAGE:$IMAGE_TAG" sbom
