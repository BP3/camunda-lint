name: Build image

on:
  workflow_call:
    inputs:
      username:
        required: true
        type: string
      project-name:
        required: true
        type: string
      org-name:
        required: true
        type: string
      image-name:
        required: true
        type: string
      branch-name:
        required: true
        type: string

jobs:
  build-image:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      # Branch names may contain characters a Docker tag cannot (most commonly '/'),
      # so map them onto the tag grammar: [a-zA-Z0-9_][a-zA-Z0-9._-]{0,127}
      - name: Derive image tag from branch name
        id: tag
        env:
          RAW_BRANCH: ${{ inputs.branch-name }}
        run: |
          tag=$(printf '%s' "$RAW_BRANCH" | sed -E 's/[^a-zA-Z0-9._-]+/-/g; s/^[^a-zA-Z0-9_]+//')
          tag=${tag:0:128}
          if [ -z "$tag" ]; then tag=branch; fi
          echo "Branch '$RAW_BRANCH' -> image tag '$tag'"
          # Both writes are needed: GITHUB_OUTPUT crosses to the test-image job,
          # GITHUB_ENV serves the remaining steps in this job.
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "IMAGE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '>=22.14.0'
          check-latest: true

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install

      - name: Generate SBOM
        run: |
          npx @cyclonedx/cyclonedx-npm -o camunda-lint-sbom.json

      - name: List generated SBOM file
        run: ls -l camunda-lint-sbom.json

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Find previous image tagged with branch name - and delete it
        run: |
          json_response_file=$(mktemp)

          http_status=$(curl -s -w "%{http_code}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -o "${json_response_file}" \
            "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions")

          if [ "${http_status}" -eq 404 ]; then
            exit 0
          fi

          id=$(jq -r --arg tag "$IMAGE_TAG" '.[] | select(.metadata.container.tags | index($tag)) | .id' "${json_response_file}")

          if [ "$id" != "" ]; then
            # First call is just to see the result
            curl -s -L \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions/$id"
            # Second call does the actual delete
            curl -s -L -X DELETE \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/orgs/${{ inputs.org-name }}/packages/container/${{ inputs.project-name }}/versions/$id"
          fi
      # QEMU lets the amd64 runner build the arm64 image too. Only the npm install in
      # the Dockerfile runs emulated; there are no native modules to compile.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build multi-arch Docker image of application, tag with branch name and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ inputs.image-name }}:${{ env.IMAGE_TAG }}
          secrets: |
            GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
          # No provenance attestation: it shows up as an extra "unknown/unknown" platform
          # in the image index on ghcr.io and Docker Hub.
          provenance: false

  test-image:
    needs: build-image
    # Test each platform on a native runner, so the arm64 image is tested on real arm64 hardware
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    name: test-image (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    env:
      # Derived once in build-image; job-level env makes it visible to every step below.
      IMAGE_TAG: ${{ needs.build-image.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '>=22.14.0'
          check-latest: true

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm install

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ inputs.username }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pull by digest, not by tag: if another build of the same branch (e.g. two quick merges
      # to main) retags the image meanwhile, this job still tests the image its own build made.
      # The local tag is what the smoke and integration tests run.
      - name: Pull the image
        env:
          IMAGE: ${{ inputs.image-name }}
          DIGEST: ${{ needs.build-image.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker pull --platform "${{ matrix.platform }}" "$IMAGE@$DIGEST"
          docker tag "$IMAGE@$DIGEST" "$IMAGE:$IMAGE_TAG"
          arch=$(docker image inspect -f '{{.Architecture}}' "$IMAGE:$IMAGE_TAG")
          echo "Testing $IMAGE:$IMAGE_TAG ($DIGEST), architecture: $arch"
          if [ "$arch" != "$EXPECTED_ARCH" ]; then
            echo "::error::Expected a $EXPECTED_ARCH image but got $arch"
            exit 1
          fi

      - name: Run Smoke Test
        env:
          IMAGE: ${{ inputs.image-name }}
        run: |
          docker run -i --rm \
            --mount "type=bind,src=${PWD}/test/smoke-test,dst=/project" \
            "$IMAGE:$IMAGE_TAG" lint

      - name: Run Integration Tests
        env:
          IMAGE_NAME: ${{ inputs.image-name }}
          BRANCH_NAME: ${{ env.IMAGE_TAG }}
        run: |
          npm run test:integration

#      - name: Run SBOM Test
#        env:
#          IMAGE: ${{ inputs.image-name }}
#        run: |
#          docker run -i --rm "$IMAGE:$IMAGE_TAG" sbom