# The docker image has already been built - when the PR was merged to main - and it tagged as 'main'.
# All we need to do here for a "release" is to re-tag the 'main' image and copy it to Docker Hub.

name: Release new version

env:
  DOCKER_IMAGE_NAME: 'bp3global/camunda-lint'
  GITHUB_IMAGE_NAME: 'ghcr.io/bp3/camunda-lint'
  PROJECT_NAME: 'camunda-lint'
  ORG_NAME: 'bp3'

on:
  # We only want to run when the user creates a release through the UI
  release:
    types:
      - published

jobs:
  release:
    runs-on: ubuntu-latest
    steps:

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: bp3docker
          password: ${{ secrets.DOCKERHUB_BP3DOCKER }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # 'main' is a multi-arch image (linux/amd64 + linux/arm64). 'imagetools create' copies the
      # whole image index registry-to-registry; docker pull/tag/push would copy only the runner's platform.
      - name: Tag the 'main' image with the release tag on GitHub Container Registry
        run: |
          docker buildx imagetools create -t "$GITHUB_IMAGE_NAME:$GITHUB_REF_NAME" "$GITHUB_IMAGE_NAME:main"

      - name: Copy the release image to Docker Hub as the release tag and 'latest'
        run: |
          docker buildx imagetools create -t "$DOCKER_IMAGE_NAME:$GITHUB_REF_NAME" -t "$DOCKER_IMAGE_NAME:latest" "$GITHUB_IMAGE_NAME:$GITHUB_REF_NAME"

      - name: Show the platforms published
        run: |
          docker buildx imagetools inspect "$DOCKER_IMAGE_NAME:$GITHUB_REF_NAME"
