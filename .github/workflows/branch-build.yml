name: Build branch

env:
  GITHUB_IMAGE_NAME: 'ghcr.io/bp3/camunda-lint'
  PROJECT_NAME: 'camunda-lint'
  ORG_NAME: 'bp3'

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  call-workflow-build-image:
    needs: lint
    # Dependabot-triggered pull_request runs default to a read-only GITHUB_TOKEN,
    # which fails the ghcr.io push. Naming the scopes explicitly restores the
    # write that the push and the branch-tag cleanup need.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-image.yml
    with:
      username: ${{ github.actor }}
      project-name:  'camunda-lint'
      org-name:  'bp3'
      image-name: 'ghcr.io/bp3/camunda-lint'
      branch-name: ${{ github.head_ref || github.ref_name }}
    secrets: inherit
